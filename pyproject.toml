[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "farm-notary"
version = "0.1.0"
description = "Notary for AgentFarm runs: manifest hash, CID, on-chain attestation"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "Apache-2.0" }
authors = [{ name = "Dooders" }]
dependencies = []

[project.optional-dependencies]
dev = ["pytest"]
chain = ["web3>=6"]

[project.scripts]
farm-notary = "farm_notary.cli:main"

[tool.setuptools.packages.find]
include = ["farm_notary*"]
