[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "farm-notary"
version = "0.2.0"
description = "Notary for AgentFarm runs: manifest hash, optional IPFS pin, OpenTimestamps anchor"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "Apache-2.0" }
authors = [{ name = "Dooders" }]
dependencies = []

[project.optional-dependencies]
chain = ["web3>=7,<8"]
ots = ["opentimestamps>=0.4.5"]
sigstore = ["cryptography>=41"]
dev = ["pytest", "web3>=7,<8", "opentimestamps>=0.4.5", "cryptography>=41"]

[project.scripts]
farm-notary = "farm_notary.cli:main"

[tool.setuptools.packages.find]
include = ["farm_notary*"]
