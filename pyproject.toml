[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "farm-notary"
version = "0.2.0"
description = "Notary for AgentFarm runs: manifest hash, optional IPFS pin, OpenTimestamps anchor"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "Apache-2.0" }
authors = [{ name = "Dooders" }]
keywords = [
    "reproducibility",
    "notarization",
    "opentimestamps",
    "provenance",
    "agentfarm",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering",
    "Typing :: Typed",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/Dooders/FarmNotary"
Repository = "https://github.com/Dooders/FarmNotary"
Issues = "https://github.com/Dooders/FarmNotary/issues"
Changelog = "https://github.com/Dooders/FarmNotary/blob/dev/CHANGELOG.md"

[project.optional-dependencies]
chain = ["web3>=7,<8"]
ots = ["opentimestamps>=0.4.5"]
sigstore = ["cryptography>=41"]
lint = ["ruff>=0.6", "mypy>=1.11"]
dev = [
    "pytest",
    "web3>=7,<8",
    "opentimestamps>=0.4.5",
    "cryptography>=41",
    "ruff>=0.6",
    "mypy>=1.11",
]

[project.scripts]
farm-notary = "farm_notary.cli:main"

[tool.setuptools.packages.find]
include = ["farm_notary*"]

[tool.setuptools.package-data]
farm_notary = ["py.typed"]

[tool.ruff]
target-version = "py39"
src = ["farm_notary"]

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.10"
packages = ["farm_notary"]
warn_unused_ignores = true
no_implicit_optional = true
ignore_missing_imports = false

[[tool.mypy.overrides]]
module = ["opentimestamps", "opentimestamps.*"]
ignore_missing_imports = true
